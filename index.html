<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mono.blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #2a2a2a;
      color: #d4d4d4;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 350;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .page { max-width: 640px; width: 100%; }

    ul { list-style: none; }
    li { margin-bottom: 1.2rem; }

    ul a {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 1.3rem;
      display: block;
      padding: 0.6rem 0;
      border-bottom: 1px solid #4a4a4a;
      transition: color 0.15s ease, padding-left 0.15s ease;
    }
    ul a:hover { color: #fff; padding-left: 0.5rem; }

    h1 { font-size: 1.6rem; font-weight: 450; color: #f0f0f0; margin-bottom: 1.5rem; }
    p { color: #c0c0c0; margin-bottom: 1rem; }

    .back {
      display: inline-block;
      margin-top: 2rem;
      color: #a0a0a0;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px dotted #6a6a6a;
    }
    .back:hover { color: #f0f0f0; }
  </style>
</head>
<body>
  <div class="page" id="app"></div>

  <script>
    const posts = [
      {
        id: 'absence-of-colour',
        title: 'the absence of colour',
        body: [
          'Working in black, white and grey doesn\'t mean the work is dull. It means every value earns its place.',
          'Stripping away hue forces structure, contrast, and rhythm to carry the message.'
        ]
      },
      {
        id: 'quiet-interface',
        title: 'quiet interface',
        body: [
          'A blog should feel like a quiet room. No neon, no noise. Just text and the space between it.',
          'When everything is monochrome, reading becomes the focus.'
        ]
      },
      {
        id: 'notes-on-simplicity',
        title: 'notes on simplicity',
        body: [
          'Super simple means no hidden complexity. One file. No build tools. No dependencies.',
          'Black background, white type, a few greys to separate what matters.'
        ]
      }
    ];

    const app = document.getElementById('app');
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const post = id ? posts.find(p => p.id === id) : null;

    // Build the "back" URL using only the pathname (drops ?id=...)
    const homeUrl = location.pathname;

    if (post) {
      app.innerHTML = `
        <article>
          <h1>${post.title}</h1>
          ${post.body.map(p => `<p>${p}</p>`).join('')}
          <a class="back" href="${homeUrl}">← back</a>
        </article>`;
    } else if (id) {
      app.innerHTML = `<p>not found</p><a class="back" href="${homeUrl}">← back</a>`;
    } else {
      app.innerHTML = `
        <ul>
          ${posts.map(p => `<li><a href="?id=${encodeURIComponent(p.id)}">${p.title}</a></li>`).join('')}
        </ul>`;
    }

    // Safety net: if the page loads with an ?id= that doesn't exist AND
    // the user presses browser back, hash/query changes won't fire a reload
    // by themselves — but a normal link click will. This covers the edge
    // case where the browser restores a cached page with the old query.
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) location.reload();
    });
  </script>
</body>
</html>
